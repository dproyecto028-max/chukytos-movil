<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>CHUKYTOS Mobile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="login-screen" id="loginScreen">
      <div class="brand-block">
        <div class="brand-mark">
          <img src="logo chukytos.gif" alt="Logo CHUKYTOS" />
        </div>
        <h1>CHUKYTOS</h1>
        <p>Mobile</p>
      </div>

      <form id="loginForm" class="login-card">
        <h2>Iniciar sesión</h2>
        <label>
          <span>Usuario</span>
          <input id="loginUser" type="text" placeholder="user" autocomplete="username" required />
        </label>
        <label>
          <span>Contraseña</span>
          <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </label>
        <button class="primary" type="submit">Entrar</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </div>

    <div class="main-screen hidden" id="mainScreen">
      <header class="topbar">
        <div class="topbar-brand">
          <div class="mini-brand-mark">
            <img src="logo chukytos.gif" alt="Logo CHUKYTOS" />
          </div>
          <div>
            <p class="eyebrow">CHUKYTOS</p>
            <h2>Mobile</h2>
          </div>
        </div>
        <button class="logout-btn" id="logoutBtn" type="button">Salir</button>
      </header>

      <main class="content">
        <section class="panel active" id="panelVentas">
          <div class="panel-head">
            <h3>Ventas</h3>
            <button class="ghost" id="quickScanBtn" type="button">Escanear</button>
          </div>

          <div class="field-group">
            <label class="field-label" for="saleCode">Código de barras</label>
            <input id="saleCode" type="text" placeholder="Escaneá o escribí el código" inputmode="numeric" autocomplete="off" />
          </div>
          <div class="field-group small-field">
            <label class="field-label" for="saleQty">Cantidad</label>
            <input id="saleQty" type="number" value="1" min="1" />
          </div>

          <button class="primary full" id="addSaleItemBtn" type="button">Agregar al carrito</button>
          <p id="saleMessage" class="status-text"></p>

          <div class="cart-box">
            <h4>Carrito</h4>
            <div id="saleCartList" class="cart-list"></div>
            <div class="total-row">
              <span>Total</span>
              <strong id="saleTotal">$ 0</strong>
            </div>
            <button class="primary full" id="finishSaleBtn" type="button">Registrar venta</button>
          </div>
        </section>

        <section class="panel hidden" id="panelIngreso">
          <div class="panel-head">
            <h3>Registrar ingreso</h3>
          </div>

          <div class="stack">
            <div class="field-group">
              <label class="field-label" for="entryCode">Código de barras</label>
              <input id="entryCode" type="text" placeholder="Escaneá o escribí el código" />
            </div>
            <div class="field-group">
              <label class="field-label" for="entryName">Nombre del producto</label>
              <input id="entryName" type="text" placeholder="Ej.: Galletitas de chocolate" />
            </div>
            <div class="two-col">
              <div class="field-group">
                <label class="field-label" for="entryQty">Cantidad</label>
                <input id="entryQty" type="number" min="1" value="1" placeholder="Cantidad" />
              </div>
              <div class="field-group">
                <label class="field-label" for="entryMin">Stock mínimo</label>
                <input id="entryMin" type="number" min="0" value="0" placeholder="0" />
              </div>
            </div>
            <div class="two-col">
              <div class="field-group">
                <label class="field-label" for="entryCost">Costo</label>
                <input id="entryCost" type="number" min="0" step="0.01" placeholder="0" />
              </div>
              <div class="field-group">
                <label class="field-label" for="entryPrice">Precio de venta</label>
                <input id="entryPrice" type="number" min="0" step="0.01" placeholder="0" />
              </div>
            </div>
            <div class="field-group">
              <label class="field-label" for="entryCategory">Categoría</label>
              <input id="entryCategory" type="text" placeholder="Ej.: Lácteos" />
            </div>
            <div class="field-group">
              <label class="field-label" for="entryExpiry">Fecha de vencimiento</label>
              <input id="entryExpiry" type="date" />
            </div>
            <button class="primary full" id="saveEntryBtn" type="button">Guardar ingreso</button>
            <p id="entryMessage" class="status-text"></p>
          </div>
        </section>

        <section class="panel hidden" id="panelConsulta">
          <div class="panel-head">
            <h3>Consultar precio / stock</h3>
          </div>

          <div class="stack">
            <div class="field-group">
              <label class="field-label" for="lookupCode">Código de barras</label>
              <input id="lookupCode" type="text" placeholder="Escaneá o escribí el código" />
            </div>
            <button class="primary full" id="lookupBtn" type="button">Consultar</button>
            <div id="lookupResult" class="lookup-box empty">
              <span>Sin consulta aún</span>
            </div>
          </div>
        </section>
      </main>

      <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="panelVentas" type="button">Ventas</button>
        <button class="nav-btn" data-tab="panelIngreso" type="button">Ingreso</button>
        <button class="nav-btn" data-tab="panelConsulta" type="button">Consulta</button>
      </nav>
    </div>
  </div>

  <div class="camera-modal hidden" id="cameraModal">
    <div class="camera-card">
      <div class="camera-header">
        <strong>Escaneo</strong>
        <button id="closeCameraBtn" type="button">✕</button>
      </div>
      <video id="cameraVideo" autoplay playsinline muted></video>
      <p id="cameraStatus">Ajustá la cámara sobre el código.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
